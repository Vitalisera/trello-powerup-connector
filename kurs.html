<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kursöversikt" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#08445c" />
  <link rel="manifest" href="./kurs-manifest.json" />
  <link rel="apple-touch-icon" href="./kurs-ikon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./kurs-ikon-192.png" />
  <title>Kursöversikt</title>
  <!-- Webbappen steg 2 (Robert 2026-11-14): kursöversikten som egen sida, för att SE. Samma filer som Power-Upen,
       men ersättaren fristaende.js i stället för Trellos bibliotek, och läsläge: inga skrivningar härifrån. -->
  <script>
    // Standardversion för webbappens filer (Robert 2026-11-14: tabellen syntes i telefonen). Hemskärmsikonen öppnar
    // utan ?v, och då laddades filerna oversionerade, så en gammal cachad kurs-mobil.css kunde visas. HÖJ VID VARJE
    // UPPLADDNING av webbappens filer, OCH i kurs-version.json (uppdateringsbanderollen jämför de två; proof_kursuppdatering.js
    // fångar en glömd höjning).
    window.VZ_KURS_V = 'k15';
    (function () {
      var v = window.VZ_KURS_V;   // ?v i adressen ignoreras helt: html, css och js ska alltid höra ihop (Robert 14/11: kurs.html?v=176)
      var q = v ? ('?v=' + encodeURIComponent(v)) : '';
      document.write('<link rel="stylesheet" href="./course.css' + q + '">');
      document.write('<link rel="stylesheet" href="./kurs-mobil.css' + q + '">');
    })();
  </script>
  <style>html,body{height:100%;margin:0}</style>
</head>
<body>
  <!-- data-vz-manual FRÅN START: sidan ligger överst i fönstret, så course-view.js demospärr (self !== top) gäller inte.
       Utan attributet skulle påhittade deltagare (DEMO_MODEL) visas om course.js inte hann laddas. -->
  <div id="root" data-vz-manual="1"></div>
  <script>
    window.VZ_SIDA = { titel: 'Kursöversikt', tavla: '5e3829153e99a8775073f2aa', lasande: true };   // Vitalisera Admin
    (function () {
      var v = window.VZ_KURS_V;   // ?v i adressen ignoreras helt: html, css och js ska alltid höra ihop (Robert 14/11: kurs.html?v=176)
      var q = v ? ('?v=' + encodeURIComponent(v)) : '';
      ['./fristaende.js' + q, './config.js' + q, './course-view.js' + q, './course.js' + q, './kurs-lasande.js' + q, './kurs-listor.js' + q, './kurs-incheckning.js' + q, './kurs-nav.js' + q, './kurs-uppdatering.js' + q]
        .forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); });
    })();
  </script>
  <!-- Versions-badge (cache-diagnos). -->
  <script>
    (function () {
      var b = document.createElement('div');
      b.id = 'vz-ver';
      b.textContent = 'v' + (window.VZ_KURS_V || '?');   // sidans egen version, inte ?v ur adressen
      b.title = 'Connector-version';
      b.style.cssText = 'position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:99999;font:600 11px/1 Calibri,system-ui,sans-serif;color:#5d7c87;background:rgba(255,255,255,.82);padding:3px 7px;border-radius:6px;pointer-events:none;opacity:.7';
      function add(){ (document.body || document.documentElement).appendChild(b); }
      if (document.body) { add(); } else { document.addEventListener('DOMContentLoaded', add); }
    })();
  </script>
</body>
</html>
